<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Můj Rozpočet</title>

<style>
:root{
  --bg:#050505;
  --card:#0b0b0b;
  --card2:#101010;
  --border:#1b1b1b;
  --text:#eaeaea;
  --muted:#8b8b8b;
}

*{box-sizing:border-box}

body{
  font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial;
  background:
    radial-gradient(1200px 700px at 20% -10%, #161616, transparent),
    radial-gradient(900px 600px at 90% 120%, #0f0f0f, transparent),
    var(--bg);
  color:var(--text);
  margin:0;
  padding:18px;
}

.header{
  position:sticky;
  top:0;
  background:rgba(5,5,5,0.85);
  backdrop-filter: blur(10px);
  padding:14px 0;
  margin-bottom:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

h2{margin:0;font-size:20px;}

.badge{
  font-size:11px;
  padding:4px 10px;
  border-radius:999px;
  border:1px solid var(--border);
  color:#8b8b8b;
  background:#0a0a0a;
}

.card{
  background:linear-gradient(180deg,var(--card),var(--card2));
  border:1px solid var(--border);
  border-radius:22px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 25px 60px rgba(0,0,0,0.65);
}

.balance{
  font-size:34px;
  font-weight:800;
}

.small{font-size:12px;color:#8b8b8b;margin-top:6px;}

.segment{
  display:flex;
  gap:6px;
  margin-top:10px;
  flex-wrap:wrap;
}

.segment button{
  flex:1;
  padding:10px;
  border-radius:12px;
  border:1px solid var(--border);
  background:#0a0a0a;
  color:#8b8b8b;
  cursor:pointer;
}

.segment button.active{
  background:#151515;
  color:#fff;
}

input,button{
  width:100%;
  padding:12px;
  margin-top:8px;
  border-radius:14px;
  border:1px solid var(--border);
  background:#070707;
  color:var(--text);
}

button{cursor:pointer;}
button:hover{transform:translateY(-1px);}

.row{
  display:flex;
  justify-content:space-between;
  padding:10px 0;
  border-bottom:1px solid #161616;
}

.delete{color:#555;cursor:pointer;}
.delete:hover{color:#aaa;}

.hidden{display:none;}

.warning{
  color:#e0a458;
  font-size:12px;
  margin-top:8px;
}
</style>
</head>

<body>

<div class="header">
  <h2>💰 Rozpočet</h2>
  <span class="badge">FIX</span>
</div>

<div class="card">
  <div class="balance">Zůstatek: <span id="balance">0</span> Kč</div>
</div>

<div class="card">
  <div class="segment">
    <button onclick="showTab('salary')" id="tabSalary" class="active">Výplata</button>
    <button onclick="showTab('recurring')" id="tabRecurring">Pravidelné</button>
    <button onclick="showTab('transactions')" id="tabTransactions">Běžné</button>
  </div>
</div>

<div class="card" id="salaryBox">
  <input id="salary" type="number" placeholder="Výplata">
  <button onclick="setSalary()">Uložit</button>
</div>

<div class="card hidden" id="recBox">
  <input id="recName" placeholder="Pravidelná položka">
  <input id="recAmount" type="number" placeholder="Částka">
  <button onclick="addRecurring()">Přidat</button>
  <div id="recList"></div>
</div>

<div class="card hidden" id="transBox">
  <input id="note" placeholder="Poznámka">
  <input id="amount" type="number" placeholder="Částka">

  <button onclick="addTransaction('expense')">Výdaj</button>
  <button onclick="addTransaction('income')">Příjem</button>

  <button onclick="clearTransactions()">Smazat vše</button>

  <div id="list"></div>
</div>

<div id="storageWarning" class="warning hidden">
  ⚠️ Uložení se nezdařilo. Zkontrolujte, zda prohlížeč nemá zaplněné nebo zakázané úložiště (např. soukromý režim).
</div>

<script>

// Jediný, trvalý stav aplikace – žádné dělení podle měsíce/roku.
let data = loadJSON("data", {transactions: [], salary: 0});
let recurring = loadJSON("recurring", []);

// Migrace ze starého formátu (data uložená po měsících, např. "2026-06").
if(!Array.isArray(data.transactions)){
  const merged = {transactions: [], salary: 0};
  Object.keys(data).forEach(k=>{
    const month = data[k];
    if(month && Array.isArray(month.transactions)){
      merged.transactions.push(...month.transactions);
      merged.salary = month.salary || merged.salary;
    }
  });
  data = merged;
  save();
}

function loadJSON(key, fallback){
  try{
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  }catch(e){
    console.error("Chyba při čtení z úložiště:", e);
    return fallback;
  }
}

function save(){
  try{
    localStorage.setItem("data", JSON.stringify(data));
    localStorage.setItem("recurring", JSON.stringify(recurring));
    document.getElementById("storageWarning").classList.add("hidden");
    return true;
  }catch(e){
    console.error("Chyba při ukládání:", e);
    document.getElementById("storageWarning").classList.remove("hidden");
    return false;
  }
}

function calc(){
  let t = data.salary || 0;
  t += data.transactions.reduce((s,x)=>s+(x.type==='income'?x.amount:-x.amount),0);
  recurring.forEach(r => t -= r.amount);
  return t;
}

function render(){
  document.getElementById("balance").innerText = calc();
  document.getElementById("salary").value = data.salary || "";

  const list=document.getElementById("list");
  list.innerHTML="";
  data.transactions.forEach((t,i)=>{
    list.innerHTML+=`
    <div class='row'>
      <span>${t.note||'—'}</span>
      <div>
        ${t.type==='income'?'+':'-'}${t.amount}
        <span class='delete' onclick='delT(${i})'>✕</span>
      </div>
    </div>`;
  });

  const rec=document.getElementById("recList");
  rec.innerHTML="";
  recurring.forEach((r,i)=>{
    rec.innerHTML+=`
    <div class='row'>
      <span>${r.name}</span>
      <div>
        -${r.amount}
        <span class='delete' onclick='delR(${i})'>✕</span>
      </div>
    </div>`;
  });
}

function setSalary(){
  data.salary = parseFloat(document.getElementById("salary").value)||0;
  save(); render();
}

function addTransaction(type){
  const a = parseFloat(document.getElementById("amount").value);
  const n = document.getElementById("note").value;
  if(isNaN(a)) return;

  data.transactions.unshift({amount:a,note:n,type});
  save(); render();

  document.getElementById("amount").value="";
  document.getElementById("note").value="";
}

function clearTransactions(){
  if(confirm("Opravdu smazat všechny běžné transakce?")){
    data.transactions = [];
    save();
    render();
  }
}

function addRecurring(){
  const n = document.getElementById("recName").value;
  const a = parseFloat(document.getElementById("recAmount").value);
  if(!n || isNaN(a)) return;

  recurring.push({name:n, amount:a});

  save(); 
  render();

  document.getElementById("recName").value="";
  document.getElementById("recAmount").value="";
}

function delT(i){
  data.transactions.splice(i,1);
  save(); render();
}

function delR(i){
  recurring.splice(i,1);
  save(); 
  render();
}

function showTab(tab){
  document.getElementById("salaryBox").classList.add("hidden");
  document.getElementById("recBox").classList.add("hidden");
  document.getElementById("transBox").classList.add("hidden");

  document.getElementById("tabSalary").classList.remove("active");
  document.getElementById("tabRecurring").classList.remove("active");
  document.getElementById("tabTransactions").classList.remove("active");

  if(tab==="salary"){
    document.getElementById("salaryBox").classList.remove("hidden");
    document.getElementById("tabSalary").classList.add("active");
  }
  if(tab==="recurring"){
    document.getElementById("recBox").classList.remove("hidden");
    document.getElementById("tabRecurring").classList.add("active");
  }
  if(tab==="transactions"){
    document.getElementById("transBox").classList.remove("hidden");
    document.getElementById("tabTransactions").classList.add("active");
  }
}

render();

</script>

</body>
</html>
