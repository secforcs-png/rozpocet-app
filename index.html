<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Můj Rozpočet</title>

<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#050505">

<style>
body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial;background:#050505;color:#eaeaea;padding:16px;margin:0}
.card{background:#0b0b0b;border:1px solid #1b1b1b;border-radius:18px;padding:14px;margin-bottom:14px}
button,input{width:100%;padding:12px;margin-top:8px;border-radius:12px;border:1px solid #1b1b1b;background:#070707;color:#eaeaea}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #161616}
.delete{color:#777;cursor:pointer}
</style>
</head>

<body>

<div class="card">
<h2>💰 Rozpočet</h2>
<div>Zůstatek: <span id="balance">0</span> Kč</div>
</div>

<div class="card">
<input id="amount" type="number" placeholder="Částka">
<input id="note" placeholder="Poznámka">
<button onclick="add()">Přidat výdaj</button>
<div id="list"></div>
</div>

<script>
let data = JSON.parse(localStorage.getItem("data")||"[]");

function save(){
localStorage.setItem("data",JSON.stringify(data));
}

function render(){
let list=document.getElementById("list");
list.innerHTML="";
let sum=0;

data.forEach((t,i)=>{
sum-=t.amount;
list.innerHTML+=`<div class='row'><span>${t.note}</span><span>- ${t.amount} <span class='delete' onclick='del(${i})'>✕</span></span></div>`;
});

document.getElementById("balance").innerText=sum;
}

function add(){
let a=parseFloat(document.getElementById("amount").value);
let n=document.getElementById("note").value;
if(!a)return;
data.unshift({amount:a,note:n});
save();render();
document.getElementById("amount").value="";
document.getElementById("note").value="";
}

function del(i){
data.splice(i,1);
save();render();
}

render();
</script>

</body>
</html>
